>목차 보기 ☰</button></header><main><div class="reading-meta"><span id="location">나를 알아가는 책 · 표지</span><span id="themeLabel" hidden></span></div><section class="book" id="book" aria-label="디지털 책"><div id="spread"></div></section><nav class="navigation" aria-label="페이지 탐색"><button id="prev" aria-label="이전 페이지">← <span>이전</span></button><div class="progress"><span id="counter"></span><div><i id="bar"></i></div></div><button id="next"><span>책 펼치기</span> →</button></nav><p class="hint">왼쪽 페이지는 오른쪽으로, 오른쪽 페이지는 왼쪽으로 끌어 넘겨보세요</p></main><footer><span>전향미님을 위한 TCI × CST 성격 이해 안내</span><span>내 성격을 이해하고, 나에게 맞게 생활하기.</span></footer><dialog id="toc"><button id="close" aria-label="목차 닫기">✕</button><span class="eyebrow">CONTENTS</span><h2>읽을 장 선택</h2><div id="tocList"></div></dialog><script>
const CHAPTERS=[{"number": 1, "title": "나는 어떤 순간에 가장 나다워질까?", "lead": "내가 편안함과 만족감을 느끼는\n다섯 가지 상황을 살펴봅니다.", "items": [{"title": "진심으로 친절을 베풀 때", "content": "안부를 묻고, 힘든 사람의 이야기를 듣고, 필요한 일을 도와주는 순간입니다. 칭찬받기 위해서가 아니라 내가 원해서 도울 때 보람을 느낍니다. 내 시간과 체력이 허락하는 만큼 도와주세요."}, {"title": "믿는 사람과 솔직하게 대화할 때", "content": "기쁜 일뿐 아니라 서운함과 걱정도 편하게 말할 수 있는 시간입니다. 괜찮은 척하거나 말을 꾸미지 않아도 되는 사람 곁에서 마음을 놓아보세요."}, {"title": "좋아하는 풍경·음악·작품을 감상할 때", "content": "좋아하는 음악을 듣거나, 햇빛이 드는 창가에 앉거나, 꽃과 그림을 보는 순간입니다. 무언가를 이루지 않아도 좋아하는 것을 즐기는 시간은 충분히 가치 있습니다."}, {"title": "내가 정한 작은 일을 끝냈을 때", "content": "답장 하나를 보내고, 책상 한쪽을 정리하고, 약속한 산책을 마치는 순간입니다. 남에게 보여줄 큰 성과가 아니어도 좋습니다. 오늘 끝낸 일 하나를 스스로 인정해 주세요."}, {"title": "부담 없이 새로운 경험을 할 때", "content": "새로운 차를 마시거나 다른 길로 걷거나 짧은 체험 수업에 참여하는 순간입니다. 시간과 비용 부담이 적은 것부터 시작하세요. 마음에 들지 않으면 그만둬도 괜찮습니다."}], "message": "내가 편안하고 만족스러운 순간을 생활에 조금씩 늘려보세요. 감당할 만큼 돕고, 믿는 사람과 이야기하고, 좋아하는 것을 즐기세요. 오늘 끝낼 작은 일과 부담 없는 새 경험도 하나 골라보세요."}, {"number": 2, "title": "내가 반복하는 불행패턴", "lead": "당장 편해지는 선택이\n나중에도 도움이 되는지 확인합니다.", "items": [{"title": "불편한 일을 해결하기보다 피한다", "content": "어려운 일을 미루면 당장은 편하지만, 나중에는 마감 걱정까지 더해집니다. 전부 끝내려 하지 말고 가장 쉬운 첫 단계 하나만 해보세요."}, {"title": "많이 알아봤다는 이유로 판단을 끝낸다", "content": "단점과 실패 사례를 계속 찾다 보면 해보기도 전에 포기할 수 있습니다. 확인한 사실, 아직 모르는 것, 막연한 걱정을 나눠 적고 결정할 시간을 정해보세요."}, {"title": "솔직한 말이면 상대도 이해할 거라고 생각한다", "content": "친구가 힘든 이야기를 할 때 잘못부터 짚으면 위로보다 지적으로 들립니다. “내 생각을 말해줄까, 그냥 들어줄까?”라고 먼저 물어보세요."}, {"title": "겸손하게 말하다가 내 기여까지 숨긴다", "content": "“별로 한 건 없어요”라고만 말하면 내가 기여한 일을 상대가 모릅니다. 칭찬을 받으면 “고마워요. 이 부분은 제가 신경 썼어요”라고 답해보세요."}, {"title": "필요한 도움을 늦게 요청한다", "content": "모르는 일을 오래 붙잡으면 질문하기도 더 어려워집니다. 20분 동안 해결되지 않으면 해본 것과 막힌 부분을 정리해서 도움을 요청하세요."}], "message": "같은 실수가 반복되면 내가 자주 고르는 행동부터 살펴보세요. 미루기, 더 알아보기, 바로 조언하기, 내 기여를 숨기기, 질문을 늦추기 중 하나를 골라 이번에는 다르게 해보세요."}, {"number": 3, "title": "내가 반복하는 행복 패턴", "lead": "편안한 관계와 환경에서\n작은 즐거움과 성취를 확인합니다.", "items": [{"title": "익숙한 곳에서 새로운 즐거움을 찾을 때", "content": "자주 가는 동네의 새 카페나 친한 친구와 가는 새로운 식당처럼, 익숙함 속에 작은 변화를 더해보세요. 멀리 떠나지 않아도 새로운 재미를 찾을 수 있습니다."}, {"title": "자발적으로 돕고 진심이 전해졌을 때", "content": "친구에게 필요한 것을 챙겨주고 실제로 도움이 됐다는 말을 들으면 보람이 생깁니다. 의무감으로 모두를 챙기기보다 내가 기꺼이 할 수 있는 도움을 골라보세요."}, {"title": "아름다운 것을 충분히 감상할 때", "content": "꽃, 음악, 햇빛, 마음에 드는 공간을 천천히 즐겨보세요. 특별한 성과가 없는 날에도 기분 좋은 기억을 만들 수 있습니다."}, {"title": "해야 할 일이 분명하고 결과를 확인할 때", "content": "서랍 하나를 정리하거나 필요한 서류를 내고 나면 하루가 조금 가벼워집니다. 오늘 끝낼 일을 작게 정하고 완료 표시를 해보세요."}, {"title": "꾸미지 않아도 되는 사람과 함께할 때", "content": "재미있는 말을 하거나 좋은 모습을 보여주려고 애쓰지 않아도 되는 관계입니다. 편한 사람과 밥을 먹고, 각자 할 일을 하며 함께 있는 시간도 즐겨보세요."}], "message": "행복을 큰 성공 뒤로 미루지 마세요. 가까운 곳의 새로움, 기꺼이 건넨 도움, 좋아하는 풍경, 끝낸 일 하나, 편한 사람과의 시간도 충분히 즐길 수 있습니다."}, {"number": 4, "title": "내가 진짜 원하는 것은 무엇일까?", "lead": "검사 결과를 정답으로 삼기보다\n내가 원하는 삶의 조건을 확인합니다.", "items": [{"title": "내 삶을 내가 결정하고 싶다", "content": "매번 허락이나 확인을 받기보다 내가 고르고 결정하는 삶입니다. 필요한 도움은 받되, 마지막에는 내가 원하는 쪽을 선택해 보세요."}, {"title": "친절하게 대하면서 내 진심도 존중받고 싶다", "content": "다른 사람에게 잘해주면서도 내 의견과 수고를 존중받는 관계입니다. 나만 연락하고 챙기는 관계라면 원하는 바를 분명하게 이야기해 보세요."}, {"title": "안정적인 생활 안에서 새로움을 경험하고 싶다", "content": "생활의 기본은 안정적으로 유지하고, 취미나 나들이로 작은 변화를 더하는 방식입니다. 지루함을 피하려고 모든 것을 한꺼번에 바꿀 필요는 없습니다."}, {"title": "계속 증명하지 않아도 존중받고 싶다", "content": "잘한 일은 인정받고, 막힌 일이 있으면 도움을 받을 수 있는 환경입니다. 늘 경쟁하고 자신을 보여줘야 하는 부담보다 서로 배우고 돕는 분위기를 찾아보세요."}, {"title": "남들이 말하는 성공보다 만족스러운 일상을 원한다", "content": "좋아하는 공간과 음악, 편안한 관계, 의미 있는 일로 채워진 하루입니다. 돈과 성취도 포함해 무엇이 내 생활을 만족스럽게 만드는지 우선순위를 정해보세요."}], "message": "정말 좋아서 고른 것인지, 두렵거나 불편한 일을 피하려고 고른 것인지 물어보세요. 남들이 좋다는 삶보다 내가 하루하루 만족할 수 있는 선택을 조금씩 늘려보세요."}, {"number": 5, "title": "내가 진짜 피하고 싶은 것은 무엇일까?", "lead": "정말 원하지 않는 일과\n원하지만 부담스러운 일을 구분합니다.", "items": [{"title": "방법을 모르는 일을 혼자 해결해야 할 때", "content": "시작 순서와 마감도 모른 채 “알아서 하세요”라는 말을 듣는 상황입니다. 일을 맡을 때 목표, 완성 예시, 마감, 질문할 사람부터 확인해 보세요."}, {"title": "끝과 성과가 보이지 않는 일을 계속할 때", "content": "열심히 해도 언제 끝나는지 모르고 성과도 보이지 않는 상황입니다. 긴 일을 짧게 나누고, 이번 주에 끝낼 범위를 정해보세요."}, {"title": "낯선 사람 앞에서 나를 증명해야 할 때", "content": "면접이나 자기소개처럼 짧은 시간에 장점을 보여줘야 하는 상황입니다. 미리 말할 내용을 적고 연습하면 준비 없이 나서는 부담을 줄일 수 있습니다."}, {"title": "이해되지 않는 방식을 무조건 따라야 할 때", "content": "이유도 듣지 못한 채 상대의 방식을 무조건 따라야 하는 상황입니다. 바로 참거나 반박하기보다 그 방법을 택한 이유와 꼭 지켜야 할 기준을 물어보세요."}, {"title": "노력보다 부족한 결과만 평가받을 때", "content": "도우려고 애썼는데 부족한 결과만 지적받는 상황입니다. 내 의도와 상대가 원했던 결과를 따로 살펴보세요. 고칠 부분은 확인하고, 나를 깎아내리는 말에는 선을 그으세요."}], "message": "정말 하기 싫은 일과 하고 싶지만 겁나는 일을 구분해 보세요. 원하지 않는 일은 거절하고, 원하는 일은 도움을 받거나 크기를 줄여 시작해 보세요."}, {"number": 6, "title": "내가 가진 일곱 가지 강점", "lead": "성격적 강점을 실제 행동과\n결과로 연결하는 방법을 살펴봅니다.", "items": [{"title": "정직하게 말하기", "content": "듣기 좋은 말로 꾸미기보다 내가 생각하는 것을 정직하게 말합니다. 사실을 전하되 상대가 받아들일 수 있도록 말투와 순서를 다듬어보세요."}, {"title": "필요한 도움을 행동으로 보여주기", "content": "아픈 친구에게 필요한 것을 챙기고 바쁜 가족의 일을 거드는 식으로 마음을 행동에 담습니다. “무엇을 도와주면 좋을까?”라고 먼저 물어보세요."}, {"title": "함께한 사람의 기여 인정하기", "content": "함께한 사람의 수고를 알아보고 내 공만 내세우지 않습니다. 다른 사람의 기여를 인정하면서 내가 한 일도 정확하게 설명해 보세요."}, {"title": "내 역할과 약속 챙기기", "content": "함께 정한 약속과 내 역할을 중요하게 여깁니다. 방법이 다를 때는 공동의 목표를 먼저 확인하고 서로 가능한 방식을 찾아보세요."}, {"title": "일상에서 아름다움 발견하기", "content": "꽃, 음악, 색의 조합, 세심한 행동에서 좋은 점을 알아봅니다. 좋아하는 장면을 그냥 지나치지 말고 일상에서 자주 즐겨보세요."}, {"title": "선택 전에 부담도 살펴보기", "content": "새로운 선택을 할 때 재미뿐 아니라 비용, 일정, 체력도 함께 생각합니다. 걱정만 늘어놓기보다 확인할 정보와 대안을 하나씩 정해보세요."}, {"title": "구체적인 방법 찾기", "content": "막연한 설명보다 지금 할 일을 알려주는 방법을 선호합니다. 좋은 방법을 찾았다면 “오늘 무엇을 할까?”까지 정해서 행동으로 옮겨보세요."}], "message": "이미 가진 강점을 상황에 맞게 써보세요. 돕기 전에 필요한 도움을 묻고, 솔직한 말에는 배려를 더하고, 겸손하더라도 내가 한 일은 정확히 말해보세요."}, {"number": 7, "title": "나는 언제 에너지가 차고, 언제 방전될까?", "lead": "긴장을 높이는 조건과\n즐거움·보람을 느끼는 조건을 구분합니다.", "items": [{"title": "편안한 관계와 낯선 사람 앞의 긴장", "content": "충전: 꾸미거나 말을 많이 하지 않아도 편한 사람과 함께할 때입니다. 방전: 낯선 사람 앞에서 말과 표정을 계속 신경 쓸 때입니다. 만난 사람 수보다 얼마나 긴장했는지 살펴보세요."}, {"title": "부담 없는 새로움과 커지는 책임", "content": "충전: 취미와 새로운 장소를 가볍게 체험할 때입니다. 방전: 준비할 일과 예상 밖 문제가 늘고 책임이 커질 때입니다. 재미있는 일을 꼭 큰 도전으로 만들 필요는 없습니다."}, {"title": "끝이 보이는 일과 끝없는 반복", "content": "충전: 할 일과 끝나는 기준이 분명할 때입니다. 방전: 성과가 보이지 않는 일을 오래 반복할 때입니다. 긴 일에도 중간 완료 지점을 만들어보세요."}, {"title": "자발적인 도움과 강요받는 배려", "content": "충전: 내가 원해서 돕고 보람을 느낄 때입니다. 방전: 배려를 당연하게 여기고 계속 맞춰달라는 요구를 받을 때입니다. 내가 할 수 있는 범위를 미리 말해보세요."}, {"title": "준비할 여유와 갑작스러운 재촉", "content": "충전: 미리 준비하고 중간에 쉴 수 있을 때입니다. 방전: 갑자기 결정하거나 여러 일을 동시에 처리하며 재촉받을 때입니다. 할 순서와 준비 시간을 먼저 확보해 보세요."}], "message": "자꾸 지친다면 일의 양뿐 아니라 얼마나 긴장하고 맞춰주었는지 돌아보세요. 나를 지치게 하는 요구는 줄이고, 준비 시간과 쉬는 시간을 확보하세요."}, {"number": 8, "title": "스트레스를 받으면 달라지는 나의 모습", "lead": "스트레스를 받을 때의 변화를\n알아차리고 대응 방법을 정합니다.", "items": [{"title": "걱정이 많아지고 시작을 미룬다", "content": "문제가 생기면 해결보다 “잘못되면 어떡하지?”라는 생각이 앞설 수 있습니다. 실제로 생긴 일과 아직 일어나지 않은 걱정을 나누고, 지금 처리할 것 하나를 고르세요."}, {"title": "상대의 실수가 더 거슬린다", "content": "내가 벅찬 날에는 친구의 지각이나 동료의 실수가 더 불편하게 느껴집니다. 바로 평가하기 전에 사정을 묻고, 나에게 쉴 시간이 필요한지도 살펴보세요."}, {"title": "속마음을 말하지 않는다", "content": "마음이 복잡해도 “별일 없어”라고 답하고 혼자 정리하려 할 수 있습니다. “지금 일이 많아서 예민해졌어. 정리하고 이야기할게”처럼 내 상태를 알려주세요."}, {"title": "하던 일을 그만두고 싶어진다", "content": "중요한 일이어도 오래 걸리고 복잡해지면 그만두고 싶어집니다. 나를 더 몰아붙이기보다 일을 작게 나누고, 도움이 필요한 부분을 정리해 보세요."}, {"title": "빨리 결론을 내고 싶어진다", "content": "갈등이 생기면 감정을 충분히 듣기보다 빨리 결론을 내고 싶어집니다. “오늘은 서로 이야기를 듣고 내일 방법을 정하자”처럼 생각할 시간을 남겨보세요."}], "message": "힘든 날의 모습이 나의 전부는 아닙니다. 그렇다고 날카로운 말이나 미루는 행동을 그대로 두지도 마세요. 내 상태를 알리고, 잠시 쉬고, 지금 할 일 하나부터 정해보세요."}, {"number": 9, "title": "나는 어떻게 해야 마음이 회복될까?", "lead": "긴장을 낮추고 생각을 정리한 뒤\n작은 행동으로 일상에 돌아옵니다.", "items": [{"title": "사람을 만나느라 지쳤다면 자극을 줄이기", "content": "사람을 만나느라 지친 날에는 약속을 더 잡지 않아도 됩니다. 편한 옷으로 갈아입고 산책하거나 음악을 들어보세요. 혼자 있을수록 생각이 많아지면 편한 사람과 짧게 대화해 보세요."}, {"title": "걱정이 많다면 사실과 추측을 적기", "content": "종이에 실제로 일어난 일, 아직 일어나지 않은 걱정, 오늘 할 수 있는 행동을 나눠 적어보세요. 추측과 해결할 문제를 구분하면 무엇부터 할지 정하기 쉬워집니다."}, {"title": "자신에게 실망했다면 작은 약속 하나 지키기", "content": "계획을 못 지킨 날에는 큰 계획을 다시 세우기보다 답장 한 통이나 물건 다섯 개 정리를 끝내보세요. 작아도 내가 정한 일을 했다는 사실을 인정해 주세요."}, {"title": "관계에서 상처받았다면 감정과 판단 나누기", "content": "무엇 때문에 속상한지와 상대가 실제로 한 행동을 나눠보세요. 친구가 늦은 사실과 나를 소중히 여기지 않는다는 해석은 다릅니다. 진정한 뒤 원하는 행동을 구체적으로 말해보세요."}, {"title": "아무것도 하기 싫다면 감상 자체를 즐기기", "content": "좋아하는 음악을 듣고 나무와 하늘을 바라보거나, 좋아하는 컵에 차를 마셔보세요. 이 시간에는 무언가를 배우거나 결과를 남기지 않아도 됩니다."}], "message": "지쳤다면 먼저 부담을 줄이고 쉬어보세요. 쉬어도 해결할 일이 남아 마음이 무겁다면 문제를 작게 나누거나 도움을 청하세요. 하루를 못 보냈다고 나를 실패한 사람으로 보지는 마세요."}, {"number": 10, "title": "나는 어떤 사랑을 받을 때 가장 행복할까?", "lead": "편안함·존중·신뢰가\n서로 오가는 관계인지 살펴봅니다.", "items": [{"title": "마음을 재촉하지 않고 기다려주는 관계", "content": "“당장 말해봐”보다 “필요하면 이야기해. 나중에 말해도 돼”라고 기다려주는 관계입니다. 기다림을 받았다면 마음이 정리된 뒤 필요한 이야기를 꺼내보세요."}, {"title": "말과 행동이 일치하는 관계", "content": "도와주겠다는 말에 그치지 않고 약속을 지키며 실제로 돕는 관계입니다. 크고 화려한 표현보다 작은 행동이 꾸준히 이어지는지 살펴보세요."}, {"title": "서로의 방식을 존중하고 조정하는 관계", "content": "여행 일정이나 생활 방식이 다를 때 한쪽만 맞추지 않고 조율하는 관계입니다. 내 방식이 소중한 만큼 상대의 방식도 듣고 함께 정해보세요."}, {"title": "실수를 사람 전체에 대한 평가로 만들지 않는 관계", "content": "“넌 왜 항상 그래?”보다 “어디서 막혔어?”라고 묻는 관계입니다. 실수는 고치되 그 일 하나로 사람 전체를 깎아내리지 않는 태도가 중요합니다."}, {"title": "배려를 당연하게 여기지 않는 관계", "content": "작은 도움에도 고마워하고, 내가 쉬거나 거절할 때도 존중하는 관계입니다. 늘 무엇인가를 해주지 않아도 편하게 함께할 수 있는지 살펴보세요."}], "message": "나를 이해해주면서 필요한 이야기도 할 수 있는 관계를 만들어보세요. 내가 기다림과 존중을 받고 싶다면 상대에게도 같은 태도를 건네보세요."}, {"number": 11, "title": "나도 모르게 상대를 지치게 하는 건 뭘까?", "lead": "좋은 의도뿐 아니라\n상대가 경험한 영향도 확인합니다.", "items": [{"title": "공감한 뒤 곧바로 내 기준으로 판단하기", "content": "고민을 듣자마자 잘못을 짚으면 상대는 평가받는다고 느낍니다. 조언하기 전에 “내 의견이 필요해, 아니면 들어주면 될까?”라고 물어보세요."}, {"title": "마음을 충분히 말하지 않고 알아주기를 기다리기", "content": "“그냥 좀 그래”라고만 말하면 상대는 무엇이 문제인지 알기 어렵습니다. 눈치로 알아주길 기다리기보다 어떤 말이나 행동이 불편했는지 짧게 알려주세요."}, {"title": "걱정을 여러 번 말하며 선택을 흔들기", "content": "가족의 결정에 위험을 반복해서 말하면 상대는 걱정보다 간섭으로 느낍니다. 내 우려를 분명하게 말한 뒤에는 상대가 결정할 자리를 남겨주세요."}, {"title": "도와주겠다고 약속한 뒤 실행을 늦추기", "content": "도와주겠다고 약속한 뒤 소식이 없으면 상대는 계속 기다리게 됩니다. 가능한 범위와 시간을 정하고, 늦어지면 먼저 알려주세요."}, {"title": "사과 뒤에도 과거의 잘못으로 계속 평가하기", "content": "사과를 받아도 이해되지 않는 마음이 남을 수 있습니다. 지난 잘못만으로 계속 판단하기보다 지금의 행동과 바뀐 점을 함께 살펴보세요."}], "message": "좋은 뜻이었다는 말만으로 상대의 불편함이 없어지지는 않습니다. “내가 어떤 행동을 했을 때 힘들었어?”라고 묻고, 설명하거나 반박하기 전에 끝까지 들어보세요."}, {"number": 12, "title": "나는 관계에서 무엇을 기대하고, 무엇을 내려놓아야 할까?", "lead": "기대할 수 있는 존중과\n내려놓을 동일성의 요구를 구분합니다.", "items": [{"title": "진심은 기대하되 같은 표현은 요구하지 않기", "content": "기대할 것: 거짓말하지 않고 진심으로 대하는 태도입니다. 내려놓을 것: 나와 같은 방식으로 표현해야만 진심이라는 생각입니다. 도움, 안부, 함께하는 시간처럼 표현 방법은 다를 수 있습니다."}, {"title": "존중은 기대하되 모든 의견의 일치는 요구하지 않기", "content": "기대할 것: 내 의견을 무시하지 않고 듣는 태도입니다. 내려놓을 것: 나를 존중한다면 늘 동의해야 한다는 기대입니다. 서로 충분히 듣고도 다르게 생각할 수 있습니다."}, {"title": "배려는 기대하되 말하지 않은 마음을 읽기를 요구하지 않기", "content": "기대할 것: 내 마음을 이야기했을 때 진지하게 듣는 태도입니다. 내려놓을 것: 설명하지 않아도 내 속마음을 정확히 알아줘야 한다는 기대입니다."}, {"title": "책임은 기대하되 한 번도 실수하지 않기를 요구하지 않기", "content": "기대할 것: 잘못을 인정하고 고치려는 태도입니다. 내려놓을 것: 나를 소중히 여기면 한 번도 실수하지 않아야 한다는 기대입니다. 반복되는 무시·거짓말·폭력을 참을 필요는 없습니다."}, {"title": "서로 도움을 기대하되 내가 늘 도와야 한다는 부담 내려놓기", "content": "기대할 것: 나도 도움을 청하고 서로 사정을 존중하는 관계입니다. 내려놓을 것: 내가 늘 친절하고 도움이 돼야 한다는 부담입니다. 피곤한 날에는 이번에는 어렵다고 말해보세요."}], "message": "사랑과 존중을 기대하는 마음은 지켜도 됩니다. 내려놓을 것은 상대도 나와 같아야 한다는 기대입니다. 신뢰를 해치는 행동에는 기준을 지키고, 서로 다른 방식은 조율해 보세요."}, {"number": 13, "title": "나에게 잘 맞는 일하는 환경은?", "lead": "업무를 끝내기 쉬운 구조와\n서로 존중하는 문화를 함께 확인합니다.", "items": [{"title": "목표·순서·마감과 질문할 사람이 분명한 곳", "content": "목표, 순서, 마감, 완성 예시가 분명한 곳입니다. 모르는 것을 질문하고 중간에 진행 상황을 확인할 수 있으면 일에 집중하기가 쉽습니다."}, {"title": "하루나 일주일의 성과를 확인할 수 있는 곳", "content": "하루나 일주일마다 끝낸 일을 확인할 수 있는 곳입니다. 긴 프로젝트도 중간 목표가 있어야 어디까지 왔고 무엇이 남았는지 알 수 있습니다."}, {"title": "약속과 예의를 공정하게 지키는 곳", "content": "실수를 공개적으로 망신주지 않고 수정 방법을 찾는 곳입니다. 사람마다 다른 기준을 적용하지 않고 약속과 책임을 공정하게 지키는지 살펴보세요."}, {"title": "사람을 돕되 무리한 감정 요구에는 경계가 있는 곳", "content": "필요한 정보와 도움을 주되 폭언이나 무리한 요구에는 대응 기준이 있는 곳입니다. 친절을 이유로 모든 요구를 참아야 하는 환경은 피하세요."}, {"title": "자기홍보보다 실제 기여를 공정하게 보는 곳", "content": "말을 많이 하거나 자신을 잘 포장하는 사람만 인정받는 곳이 아니라, 정확한 처리와 동료 지원도 알아주는 곳입니다. 내가 한 일도 구체적으로 기록해 두세요."}], "message": "나에게 맞는 환경을 찾으면서 스스로 일을 정리하고, 시작한 일을 마치고, 성과를 설명하는 연습도 해보세요. 좋은 환경을 활용해 혼자 할 수 있는 일을 하나씩 늘려가세요."}, {"number": 14, "title": "일에서 나는 어떤 방식으로 성장할까?", "lead": "작은 업무를 끝내고, 문제를 해결하고,\n동료와 조율하는 능력을 키웁니다.", "items": [{"title": "큰 목표보다 작은 성공을 반복하며 성장해요", "content": "“업무 전문가가 되겠다”보다 “이번 주에 이 업무를 혼자 끝내겠다”로 시작하세요. 익숙한 일을 정확히 처리한 뒤 새 일을 하나씩 더하면 성장한 부분을 확인하기 쉽습니다."}, {"title": "설명을 듣는 것보다 직접 해보며 성장해요", "content": "설명을 오래 듣기만 하지 말고 실제 업무에 필요한 기능부터 써보세요. 처음에는 도움받고, 다음에는 혼자 해본 뒤, 자주 쓰는 순서를 짧게 적어두세요."}, {"title": "실수를 피하는 사람에서 실수를 해결하는 사람으로 성장해요", "content": "실수했다면 나를 탓하는 데 오래 머물지 마세요. 무엇이 잘못됐는지, 지금 어떻게 고칠지, 다음에 무엇을 확인할지 순서대로 정리하세요."}, {"title": "좋은 동료에서 함께 일하기 편한 동료로 성장해요", "content": "동료의 방법이 마음에 들지 않으면 먼저 이유를 물어보세요. 의견을 말할 때는 사람을 평가하기보다 업무의 어느 부분을 어떻게 바꾸면 좋을지 설명하세요."}, {"title": "묵묵히 일하는 사람에서 자신의 성과를 설명할 수 있는 사람으로 성장해요", "content": "“그냥 제 일을 했어요”라고 넘기지 말고 무엇을 했고 어떤 결과가 있었는지 적어보세요. “반복 문의를 모아 안내 자료를 만들었어요”처럼 사실을 말하면 됩니다."}], "message": "작은 업무를 혼자 끝내고, 실수를 고치고, 다른 의견을 듣고, 결과를 설명하는 경험을 쌓아보세요. 어제는 도움받았던 일을 오늘은 혼자 해냈다면 그것이 성장입니다."}, {"number": 15, "title": "내 성격에 맞는 목표 달성법은 뭘까?", "lead": "시작은 쉽게, 실천은 짧게,\n완료 여부는 눈에 보이게 만듭니다.", "items": [{"title": "목표를 크게 세우지 말고, 오늘 할 행동 하나로 바꾸세요", "content": "“영어를 잘하겠다”를 “저녁 식사 후 문장 세 개 읽기”로 바꿔보세요. 목표는 멋있게 들리는 말보다 오늘 시작할 행동으로 정하는 것이 좋습니다."}, {"title": "의지로 기억하지 말고, 눈에 보이는 장치를 만드세요", "content": "운동복을 미리 꺼내고, 교재를 펼쳐두고, 시작 알림을 설정하세요. 매번 기억하고 결심하지 않아도 시작할 수 있게 준비해 두세요."}, {"title": "한 달 뒤의 성과보다 오늘의 완료를 확인하세요", "content": "책 한 권을 다 읽은 날만 성공으로 보지 마세요. 오늘 다섯 쪽을 읽었다면 완료 표시를 하세요. 하루 빠졌다고 처음부터 다시 할 필요는 없습니다."}, {"title": "혼자 버티지 말고, 적당한 도움과 점검을 활용하세요", "content": "일주일에 한 번 친구와 진행 상황을 나누거나 체크 도구를 써보세요. 감시하고 재촉하는 방식보다 어디까지 했는지 함께 확인하는 방식이 좋습니다."}, {"title": "계획이 무너졌을 때는 반성보다 다시 시작하는 규칙을 만드세요", "content": "“하루 빠지면 다음 날 최소 행동 하나를 한다”, “너무 어렵다면 절반으로 줄인다”처럼 재시작 규칙을 정하세요. 실패한 하루보다 그다음 행동이 중요합니다."}], "message": "계획을 못 지킨 날에는 더 세게 결심하기보다 방법을 바꿔보세요. 더 작게 시작하고, 눈에 보이게 준비하고, 혼자 어렵다면 도움받으세요. 멈췄다가 다시 시작하는 것이 중요합니다."}, {"number": 16, "title": "어떤 성향은 인정하고, 어떤 행동은 바꾸면 좋을까?", "lead": "인정할 성향과 바꿔볼 행동을\n구분해 봅니다.", "items": [{"title": "쉽게 긴장하고 쉬고 싶어지는 나", "content": "낯선 사람을 만난 뒤 혼자 쉬고 싶을 수 있습니다. 나를 탓하기보다 회복 시간을 일정에 넣으세요. 긴장된다는 이유로 필요한 만남까지 모두 피하지는 마세요."}, {"title": "같은 일을 오래 하면 지치는 나", "content": "같은 일을 오래 반복하면 빨리 지칠 수 있습니다. 긴 일을 짧게 나누고 중간 성과를 확인하세요. 힘들어진 순간 멈췄더라도 다시 시작할 방법을 남겨두세요."}, {"title": "다른 사람의 방식을 받아들이기 어려운 나", "content": "상대의 마음은 이해해도 행동에는 동의하기 어려울 수 있습니다. 내 기준이 있는 것은 괜찮습니다. 다만 나와 다른 것과 잘못된 것은 구분해 주세요."}, {"title": "감정을 천천히 표현하는 나", "content": "마음을 정리한 뒤 말하고 싶을 수 있습니다. 표현을 크게 바꿀 필요는 없지만, 중요한 감정은 짧게라도 알려주세요. “고마웠어”, “그 말은 서운했어”로 시작해도 됩니다."}, {"title": "앞에 나서기보다 조용히 기여하는 나", "content": "조용히 역할을 하고 사람을 돕는 방식도 가치 있습니다. 내 모습을 과장할 필요는 없습니다. 대신 실제로 잘한 일과 필요한 의견까지 숨기지는 마세요."}], "message": "바꾸기 어려운 성향 때문에 나를 미워하지 마세요. 부담을 줄일 조건은 만들고, 일과 관계를 어렵게 만드는 행동은 조금씩 바꿔보세요. 나를 인정하는 것과 행동을 바꾸는 것은 함께할 수 있습니다."}, {"number": 17, "title": "앞으로 행복하게 살기 위해 무엇을 바꿔야 할까?", "lead": "걱정과 미루기를 줄이고,\n내가 원하는 생활을 선택합니다.", "items": [{"title": "걱정이 사라질 때까지 기다리지 말고, 걱정하면서도 시작하세요", "content": "걱정이 다 사라질 때까지 기다리지 말고 감당할 수 있는 작은 시도를 해보세요. 취미가 궁금하다면 장비부터 사기보다 일일 체험부터 시작하세요."}, {"title": "기분에 따라 움직이는 생활에서, 작은 약속이 있는 생활로 바꿔보세요", "content": "하고 싶은 날에만 하기보다 “주 세 번, 저녁 식사 후 10분 걷기”처럼 작은 약속을 정하세요. 못 한 날이 있어도 다음 기회에 다시 하면 됩니다."}, {"title": "다른 사람이 틀렸는지 판단하기 전에, 나와 다를 뿐인지 살펴보세요", "content": "상대가 이해되지 않으면 “왜 그렇게 생각했어?”라고 물어보세요. 내 기준과 다르다는 것만으로 틀렸다고 결론 내리지 마세요."}, {"title": "좋은 사람이 되려는 노력만큼, 내가 원하는 것을 표현하는 연습을 하세요", "content": "쉬고 싶으면 “오늘은 쉬고 싶어. 다음에 만나자”라고 말해보세요. 거절뿐 아니라 내가 하고 싶은 일도 먼저 제안해 보세요."}, {"title": "남들이 정한 성공보다, 내가 만족하는 하루를 만들어보세요", "content": "편안한 관계와 좋아하는 활동이 있는 하루를 만들어보세요. 지금 생활이 좋아서 선택한 것인지, 바꾸는 것이 두려워 머무는 것인지도 가끔 돌아보세요."}], "message": "모든 걱정을 없앤 뒤에 움직이려 하지 마세요. 원하는 일에 작은 행동 하나를 더하고, 내 바람을 말하고, 다른 사람의 이유도 들어보세요. 오늘의 선택부터 바꿀 수 있습니다."}, {"number": 18, "title": "앞으로도 행복하기 위해 무엇을 지켜가야 할까?", "lead": "좋은 강점은 유지하고,\n실제로 도움이 되는 방식으로 사용합니다.", "items": [{"title": "나를 속이지 않는 솔직함은 지켜가세요", "content": "원하는 것과 원하지 않는 것을 솔직히 알아차리세요. 내키지 않는 일은 정중히 거절하고 잘못은 인정하세요. 솔직함을 지키면서 말투도 배려할 수 있습니다."}, {"title": "사람을 따뜻하게 대하는 마음은 지켜가세요", "content": "안부를 묻고, 작은 도움을 주고, 고마움을 표현하는 마음을 지켜주세요. 모든 사람의 문제를 내가 해결할 필요는 없습니다. 내 시간과 여유도 함께 챙기세요."}, {"title": "작은 아름다움에 마음이 움직이는 감각은 지켜가세요", "content": "꽃, 음악, 식탁, 계절의 풍경을 즐기는 시간을 남겨두세요. 멀리 가거나 큰돈을 쓰지 않아도 평범한 날에 좋아하는 것을 누릴 수 있습니다."}, {"title": "자신을 과장하지 않는 겸손함은 지켜가세요", "content": "모르는 것은 배우고 도움받은 일에는 고마워하세요. 잘한 일을 칭찬받으면 “고마워요. 저도 열심히 했어요”라고 답해보세요. 나를 과장하지 않는 것과 낮추는 것은 다릅니다."}, {"title": "나 혼자만이 아니라 함께 살아간다는 마음은 지켜가세요", "content": "함께 정한 약속과 내 역할을 소중히 여기세요. 모든 의견에 맞출 필요는 없습니다. 내 생각을 말하고 상대의 생각도 들으며 가능한 방법을 함께 찾아보세요."}], "message": "바꿔야 할 행동을 바꾸더라도 정직함과 친절함, 아름다움을 즐기는 마음은 지켜주세요. 더 단호해져도 친절할 수 있고, 성과를 말하면서도 겸손할 수 있습니다. 나 자신에게도 같은 배려를 건네주세요."}];

{title:'내가 가진 무기와 약점',subtitle:'',test:c=>c.number>=6&&c.number<=9,intro:'활용할 강점과 부담을 느끼는 조건을 확인합니다.\n에너지와 스트레스의 변화를 알아차리고,\n나에게 맞는 회복 방법을 찾아봅니다.'},
{title:'관계 돌보기',subtitle:'',test:c=>c.number>=10&&c.number<=12,intro:'어떤 관계에서 편안함과 신뢰를 느끼는지 살펴봅니다.\n내 행동이 상대에게 미치는 영향을 확인하고,\n기대할 것과 내려놓을 것을 구분합니다.'},
{title:'일 돌보기',subtitle:'',test:c=>c.number>=13&&c.number<=15,intro:'내 강점을 활용하고 일을 끝낼 수 있는 환경을 살펴봅니다.\n작은 성공을 쌓는 성장 방법과\n내 성격에 맞는 목표 달성법을 정리합니다.'},
{title:'성장 전략과 실천',subtitle:'앞으로 무얼 바꿔볼까',test:c=>c.number>=16,intro:'인정할 성향과 바꿀 행동을 구분합니다.\n행복을 위해 실천할 변화와 유지할 강점을 정리하고,\n지금 시작할 행동 한 가지를 선택합니다.'}
];
const SPREADS=[{type:'cover'},{type:'contents'}];
groups.forEach((g,part)=>{SPREADS.push({type:'part',part});CHAPTERS.filter(g.test).forEach(chapter=>SPREADS.push({type:'chapter',part,chapter}));});
const total=SPREADS.length;
let page=Math.max(0,Math.min(total-1,Number(new URLSearchParams(location.search).get('page'))||0));
let mobileSide=0;
const isMobile=()=>matchMedia('(max-width:600px)').matches;
const position=()=>isMobile()?page*2+mobileSide:page;
const pageCount=()=>isMobile()?total*2:total;
function navigate(delta){if(isMobile()){const next=Math.max(0,Math.min(total*2-1,position()+delta));go(Math.floor(next/2),next%2);}else go(page+delta);}
const chapterPage=n=>SPREADS.findIndex(x=>x.type==='chapter'&&x.chapter.number===n);
const partPage=i=>SPREADS.findIndex(x=>x.type==='part'&&x.part===i);
const missing=Array.from({length:18},(_,i)=>i+1).filter(n=>!CHAPTERS.some(c=>c.number===n));
const missingText=missing.length?'아직 원문을 받지 못한 장: '+missing.map(n=>String(n).padStart(2,'0')).join(', ')+'. 해당 내용은 임의로 작성하지 않았습니다.':'';
const folio=(n,right=false)=>`<span class="page-number ${right?'right':''}">${String(n).padStart(2,'0')}</span>`;
function tocHtml(modal=false){return groups.map((g,i)=>`<button class="toc-part part-link" data-go="${partPage(i)}">${i+1}부 ${esc(g.title)}${g.subtitle?` <span>“${esc(g.subtitle)}”</span>`:''}</button>${CHAPTERS.filter(g.test).map(c=>`<button class="${modal?'toc-row':'list-link'}" data-go="${chapterPage(c.number)}"><span class="toc-chapter-number">${String(c.number).padStart(2,'0')}.</span> <span class="toc-title">${esc(c.title)}</span> <span class="toc-folio">${String(chapterPage(c.number)*2).padStart(2,'0')} →</span></button>`).join('')}`).join('');}
function render(){let html='';const entry=SPREADS[page],chapter=entry.chapter;
 if(page===0){html=`<div class="leaf cover"><span class="eyebrow">JEON HYANGMI · PERSONAL BOOK</span><h2>향미사용설명서</h2><div class="subtitle">내 인생 잘 굴리는 법</div>${art()}<p class="byline">전향미님을 위한 성격 이해와 생활 안내</p><small>TCI × CST · PERSONAL GUIDE</small></div><div class="leaf opening"><span class="eyebrow">이 책의 목적</span><h2>내 성격을 이해하고,<br>생활에 적용하기</h2><div class="small-rule"></div><p>무엇을 좋아하고 어떤 상황에서 부담을 느끼는지 알면, 일과 관계에서 나에게 맞는 방법을 선택하는 데 도움이 됩니다.</p><p>총 18개 장을 질문 하나와 장별 답변으로 구성했습니다. 06장은 일곱 가지 강점, 나머지 장은 다섯 가지 항목으로 정리했습니다. 내 경험과 비교하면서 실제로 해볼 행동을 한 가지씩 골라보세요.</p><p class="source-summary">현재 읽을 수 있는 장은 ${CHAPTERS.length}개입니다. 장 번호는 원문을 기준으로 유지했습니다.</p>${folio(1,true)}</div>`;
 }else if(page===1){html=`<div class="leaf opening contents-page"><span class="eyebrow">전체 목차</span><h2>나는 어떤 사람이고,<br>어떻게 살면 좋을까?</h2>${tocHtml()}${missingText?`<p class="missing-source">${missingText}</p>`:''}${folio(2)}</div><div class="leaf opening"><span class="eyebrow">읽는 방법</span><h2>지금 필요한 것부터<br>하나씩 실천하기</h2>${art()}<p>왼쪽에는 질문과 장 번호가, 오른쪽에는 장별 답변과 향미님께 전하는 말이 있습니다. 목차의 제목을 누르면 해당 장으로 이동합니다.</p><p>각 항목에서 일상 속 모습과 바로 해볼 행동을 확인하세요. 장 끝에는 기억할 내용을 짧게 정리했습니다.</p><p class="note">모든 내용을 한꺼번에 실천할 필요는 없습니다. 지금 나에게 필요한 행동 한 가지부터 시작해 보세요.</p>${folio(3,true)}</div>`;
 }else if(entry.type==='part'){const g=groups[entry.part];html=`<div class="leaf part-title-page"><span class="eyebrow">PART ${String(entry.part+1).padStart(2,'0')}</span><span class="part-numeral">${String(entry.part+1).padStart(2,'0')}</span><div class="small-rule"></div><h2>${esc(g.title)}</h2>${g.subtitle?`<p class="part-subtitle">“${esc(g.subtitle)}”</p>`:''}${folio(page*2)}</div><div class="leaf part-intro-page"><span class="eyebrow">${entry.part+1}부 소개</span><p class="part-description">${esc(g.intro).replace(/\n/g,'<br>')}</p><div class="small-rule"></div><span class="part-chapter-range">${String(CHAPTERS.filter(g.test)[0].number).padStart(2,'0')} — ${String(CHAPTERS.filter(g.test).at(-1).number).padStart(2,'0')}장</span>${folio(page*2+1,true)}</div>`;
 }else{const part=entry.part+1;html=`<div class="leaf chapter question-page"><span class="eyebrow">0${part}부 · ${groups[part-1].title}</span><div class="small-rule"></div><span class="question-number">${String(chapter.number).padStart(2,'0')}.</span><h2 class="chapter-question">${esc(chapter.title)}</h2><p class="lead">${esc(chapter.lead)}</p>${art()}<div class="margin-letter">읽은 뒤, 이번 주에 실천할<br>행동 한 가지를 골라보세요.</div>${folio(page*2)}</div><div class="leaf answers-page"><span class="eyebrow">${String(chapter.number).padStart(2,'0')}장 · ${chapter.items.length}가지 답변</span><div class="all-answers">${chapter.items.map((m,i)=>`<section class="answer-item"><h3><span>${String(i+1).padStart(2,'0')}</span>${esc(m.title)}</h3><p>${esc(m.content)}</p></section>`).join('')}</div><div class="answer-message final-message"><b>향미님께 전하는 말</b><p>${esc(chapter.message)}</p></div>${folio(page*2+1,true)}</div>`;}
 $('#book').classList.toggle('chapter-book',page>=2);$('#book').dataset.side=mobileSide?'right':'left';$('#spread').innerHTML=html;
 $('#counter').textContent=`${String(position()+1).padStart(2,'0')} / ${String(pageCount()).padStart(2,'0')}`;$('#bar').style.width=`${(position()+1)/pageCount()*100}%`;$('#prev').disabled=position()===0;$('#next').disabled=position()===pageCount()-1;$('#next span').textContent=position()===0?'책 펼치기':position()===pageCount()-1?'마지막 장':'다음';$('#location').textContent=page===0?'성격과 생활 안내 · 표지':page===1?'전체 목차':entry.type==='part'?`${entry.part+1}부 · ${groups[entry.part].title}`:`${String(chapter.number).padStart(2,'0')}장 · ${chapter.title}`;$('#themeLabel').textContent='';$('.hint').textContent=matchMedia('(max-width:600px)').matches?'오른쪽을 탭하면 다음 페이지 · 왼쪽을 탭하면 이전 페이지':'왼쪽 페이지는 오른쪽으로, 오른쪽 페이지는 왼쪽으로 끌어 넘겨보세요';
 $('#spread').insertAdjacentHTML('beforeend',`<button class="page-corner corner-prev" aria-label="책 모서리로 이전 페이지 넘기기" ${position()===0?'disabled':''}><span>←</span></button><button class="page-corner corner-next" aria-label="책 모서리로 다음 페이지 넘기기" ${position()===pageCount()-1?'disabled':''}><span>→</span></button>`);
 $('.corner-prev').onclick=()=>navigate(-1);$('.corner-next').onclick=()=>navigate(1);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
}
function art(){return `<svg class="art" viewBox="0 0 280 210" fill="none" aria-hidden="true"><ellipse cx="142" cy="185" rx="104" ry="12" fill="var(--soft)" opacity=".35"/><circle cx="158" cy="86" r="69" fill="var(--soft)" opacity=".45"/><path d="M47 166c25-25 65-31 95-12 30-19 65-14 92 12v16c-34-14-66-12-92 1-31-15-61-16-95-1z" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/><path d="M142 154v29M57 171c26-11 50-11 72 0m26 0c22-11 46-11 68 0M141 150c-10-34-10-68 6-105" stroke="var(--accent)" stroke-width="1.5"/><path d="M139 122c-26 0-43-15-39-32 22 0 38 12 39 32m0-23c24-3 39-19 33-33-20 3-33 16-33 33m1-24c-17-6-23-20-17-33 18 5 24 17 17 33" fill="var(--accent)" opacity=".65"/><circle cx="200" cy="48" r="5" fill="var(--accent)" opacity=".5"/><path d="m67 69 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="var(--accent)" opacity=".5"/>${theme==='garden'?'<path d="M193 157c-8-15-6-29 0-29 7 0 9 14 9 14s2-17 9-15c7 2 4 20 0 27 15 22-29 29-18 3" fill="#e3b99a" stroke="var(--accent)"/><circle cx="198" cy="156" r="1.5" fill="var(--ink)"/><circle cx="208" cy="156" r="1.5" fill="var(--ink)"/>':''}</svg>`}
let turning=false,drag=null,suppressClickUntil=0;
function makeSheet(forward){
 const book=$('#book'),oldLeaf=$('#spread').querySelector(isMobile()?(mobileSide?'.leaf:last-of-type':'.leaf:first-child'):(forward?'.leaf:last-of-type':'.leaf:first-child'));
 const sheet=document.createElement('div');sheet.className=`turning-sheet ${forward?'turn-forward':'turn-back'}`;
 const front=oldLeaf.cloneNode(true);front.classList.add('sheet-front');front.querySelectorAll('button').forEach(b=>b.disabled=true);
 const back=document.createElement('div');back.className='sheet-back';sheet.append(front,back);sheet.setAttribute('aria-hidden','true');sheet.inert=true;
 sheet.style.height=`${oldLeaf.getBoundingClientRect().height}px`;
 if(matchMedia('(max-width:600px)').matches){sheet.style.width='100%';sheet.style.left='0';sheet.style.top=`${oldLeaf.offsetTop}px`;}
 return sheet;
}
function revealUnderSheet(forward,target,sheet){
 // Prepare only the page under the moving sheet; the opposite page stays current.
 const originalPage=page,selector=forward?'.leaf:last-of-type':'.leaf:first-child';
 page=target;render();
 const upcoming=$('#spread').querySelector(selector).cloneNode(true);
 const reverse=$('#spread').querySelector(forward?'.leaf:first-child':'.leaf:last-of-type').cloneNode(true);
 reverse.inert=true;reverse.style.transform='none';
 sheet.querySelector('.sheet-back').append(reverse);
 page=originalPage;render();
 upcoming.inert=true;
 $('#spread').querySelector(selector).replaceWith(upcoming);
}
async function settle(sheet,forward,from,to){
 const sign=forward?-1:1;
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  await sheet.animate([{transform:`rotateY(${sign*180*from}deg)`},{transform:`rotateY(${sign*180*to}deg)`}],{duration:Math.max(180,700*Math.abs(to-from)),easing:'cubic-bezier(.25,.1,.25,1)',fill:'forwards'}).finished;
 }
 sheet.remove();$('#book').classList.remove('is-turning','is-dragging');turning=false;
}
async function go(n,side=0){
 const target=Math.max(0,Math.min(total-1,n));
 if(isMobile()){
  side=side===1?1:0;if(turning||(target===page&&side===mobileSide))return;
  const forward=target*2+side>position(),sheet=makeSheet(forward);turning=true;
  page=target;mobileSide=side;render();sheet.style.top='0';sheet.style.left='0';sheet.style.width='100%';
  $('#book').classList.add('is-turning');$('#book').append(sheet);
  await settle(sheet,forward,0,1);
  $('#book').scrollIntoView({block:'start',behavior:'instant'});return;
 }
 if(target===page||turning)return;
 const forward=target>page,sheet=makeSheet(forward);turning=true;
 revealUnderSheet(forward,target,sheet);
 $('#book').classList.add('is-turning');$('#book').append(sheet);
 await settle(sheet,forward,0,1);
 page=target;render();
}
function fitBook(){
 if(turning||drag)return;
 const savedPage=page,savedTheme=theme,book=$('#book');let tallest=0;
 book.classList.add('measuring');
 for(let p=0;p<total;p++){page=p;render();document.querySelectorAll('#spread>.leaf').forEach(el=>{tallest=Math.max(tallest,el.getBoundingClientRect().height+(theme==='classic'&&el.classList.contains('cover')?28:0));});}
 page=savedPage;theme=savedTheme;document.body.dataset.theme=theme;book.classList.remove('measuring');book.style.setProperty('--leaf-height',`${Math.ceil(tallest)}px`);render();
}
const book=$('#book');
book.addEventListener('pointerdown',e=>{
 if(turning||drag||e.button!==0||e.target.closest('button,a')&&!e.target.closest('.page-corner'))return;
 const rect=book.getBoundingClientRect(),x=e.clientX-rect.left;
 const forward=x>=rect.width/2,backward=x<rect.width/2;
 if((!forward&&!backward)||(forward&&position()===pageCount()-1)||(backward&&position()===0))return;
 drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,forward,originalPage:page,width:rect.width,sheet:null,progress:0,tapCorner:!!e.target.closest('.page-corner')};
 book.setPointerCapture(e.pointerId);
});
book.addEventListener('pointermove',e=>{
 if(!drag||drag.pointerId!==e.pointerId)return;
 const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY,distance=drag.forward?-dx:dx;
 if(isMobile()){if(Math.abs(dx)>=7||Math.abs(dy)>=7)drag.moved=true;return;}
 if(!drag.sheet){
  if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){drag=null;book.releasePointerCapture(e.pointerId);return;}
  if(distance<7)return;
  drag.sheet=makeSheet(drag.forward);turning=true;revealUnderSheet(drag.forward,drag.originalPage+(drag.forward?1:-1),drag.sheet);book.append(drag.sheet);book.classList.add('is-turning','is-dragging');
 }
 drag.progress=Math.min(.97,Math.max(0,distance/(drag.width*.75)));
 drag.sheet.style.transform=`rotateY(${(drag.forward?-1:1)*180*drag.progress}deg)`;
});
async function endDrag(e,cancel=false){
 if(!drag||drag.pointerId!==e.pointerId)return;
 const d=drag;drag=null;suppressClickUntil=performance.now()+400;
 if(book.hasPointerCapture(e.pointerId))book.releasePointerCapture(e.pointerId);
 if(!d.sheet){if(!cancel&&!d.moved&&(d.tapCorner||isMobile())&&Math.abs(e.clientX-d.startX)<7&&Math.abs(e.clientY-d.startY)<7)navigate(d.forward?1:-1);return;}
 const commit=!cancel&&d.progress>=.70;
 await settle(d.sheet,d.forward,d.progress,commit?1:0);
 page=commit?d.originalPage+(d.forward?1:-1):d.originalPage;render();
}
book.addEventListener('pointerup',e=>endDrag(e));book.addEventListener('pointercancel',e=>endDrag(e,true));
book.addEventListener('lostpointercapture',e=>{if(drag)endDrag(e,true)});
book.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitBook,180)});

$('#prev').onclick=()=>navigate(-1);$('#next').onclick=()=>navigate(1);$('#brand').onclick=e=>{e.preventDefault();go(0)};
$('#tocList').innerHTML='<button class="toc-row" data-go="0">표지 · 향미사용설명서</button><button class="toc-row" data-go="1">전체 목차</button>'+tocHtml(true)+(missingText?`<p class="missing-source">${missingText}</p>`:'');
$('#tocButton').onclick=()=>$('#toc').showModal();$('#close').onclick=()=>$('#toc').close();$('#tocList').addEventListener('click',e=>{if(e.target.closest('[data-go]'))$('#toc').close()});document.addEventListener('keydown',e=>{if($('#toc').open)return;if(e.key==='ArrowRight')navigate(1);if(e.key==='ArrowLeft')navigate(-1)});
render();fitBook();document.fonts.ready.then(fitBook);

</script></body></html>
